name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any push — catches newly-disclosed CVEs in
    # dependencies that were fine when last pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the current tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build on high/critical CVEs; still prints the full report
      # (including lower-severity findings) so nothing is silently dropped.
      - name: Full audit report (non-blocking)
        run: npm audit || true
      - name: Fail on high/critical
        run: npm audit --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=p/security-audit --config=p/typescript --config=p/owasp-top-ten
        env:
          # Optional — only needed to also upload results to semgrep.dev's
          # dashboard. Unset, this still runs the configs above and fails
          # the job on findings; results show in the Action log either way.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
